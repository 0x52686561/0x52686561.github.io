<!DOCTYPE html>
<!-- ============================================================
     大祈祷室（留言页）
     ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大祈祷室 | 神圣殉道录</title>

    <!-- 预连接字体服务器，加速加载 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap">

    <style>
        /* ===== 全局重置 ===== */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;                  /* 固定高度，禁止页面滚动 */
            overflow: hidden;               /* 页面本身不滚动 */
            background-image: url('guestbook bg1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #111;
            font-family: 'Noto Serif SC', serif;
        }

        /* 横向压缩工具类，和首页保持一致 */
        .scale-x {
            transform: scaleX(0.8);
            transform-origin: center;
            display: inline-block;
        }

        /* ===== 入场动画 =====
           两种风格：
           1. .fly-in     —— 页面整体淡入（标题、输入框、页脚）
           2. .card-fly-in —— 留言卡片飞入（更大的位移 + 轻微缩放） */

        /* 1. 淡入：从下方 20px 微微上浮 + 透明度变化 */
        .fly-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease,
                        transform 0.6s ease;
        }
        .fly-in.entered {
            opacity: 1;
            transform: translateY(0);
        }

        /* 2. 卡片淡入淡出：基于滚动位置，进入视口时淡入并轻微上浮 */
        .card-fly-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease,
                        transform 0.6s ease;
        }
        .card-fly-in.entered {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== 页面整体布局 ===== */
        .page-layout {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* ===== 页面整体容器 ===== */
        .page-wrapper {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 24px 24px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
            overflow: hidden;
            background: rgba(255, 255, 250, 0.7);   /* 不透明蒙版 */
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.1);
        }

        /* 卡片内纯洁印记装饰：贴在卡片右侧，不透明 */
        .card-seal {
            position: absolute;
            max-width: 84px;               /* 不超过头像两倍高度(42px * 2) */
            max-height: 84px;
            object-fit: contain;           /* 保持原比例 */
            pointer-events: none;
            opacity: 1;                    /* 完全不透明 */
            right: 8px;                     /* 固定在卡片右侧 */
            z-index: 1;
        }

        /* ===== 页面标题 ===== */
        .page-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #9a6b2f;
            position: relative;
        }

        .page-header h1 {
            font-size: 32px;
            letter-spacing: 10px;
            margin: 0 0 10px;
            font-weight: 700;
            color: #9a6b2f;
        }

        .page-header .subtitle {
            font-size: 13px;
            letter-spacing: 4px;
            color: #9a6b2f;
        }

        /* 标题两侧的装饰线 */
        .page-header::before,
        .page-header::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 60px;
            height: 1px;
            background: #9a6b2f;
        }
        .page-header::before { left: 0; }
        .page-header::after  { right: 0; }

        /* 返回首页链接 */
        .back-home {
            position: absolute;
            top: 20px;
            left: 24px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #9a6b2f;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .back-home:hover {
            border-bottom-color: #9a6b2f;
        }

        /* ===== 输入区 ===== */
        .composer {
            background-image: url('input-bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid #9a6b2f;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 30px;
            position: sticky;
            top: 16px;
            z-index: 100;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .composer textarea {
            width: 100%;
            min-height: 80px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px 12px;
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;   /* 只允许垂直方向拖拽放大 */
            outline: none;
            transition: border-color 0.2s;
            background: rgba(255, 255, 255, 0.85);
            color: #222;
        }

        .composer textarea:focus {
            border-color: #111;
        }

        .composer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .composer-hint {
            font-size: 12px;
            color: #999;
            letter-spacing: 1px;
        }

        /* 发送按钮：只用 iris.png 图标，无边框无文字 */
        .send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .send-btn img {
            height: 32px;
            width: auto;
        }

        /* ===== 留言列表：可滚动区域 ===== */
        .comment-list {
            flex: 1;                          /* 占满剩余空间 */
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;                 /* 只有这里滚动 */
            overflow-x: hidden;
            padding-right: 8px;               /* 给滚动条留空间 */
            scroll-behavior: smooth;
        }

        /* 自定义滚动条样式 */
        .comment-list::-webkit-scrollbar {
            width: 6px;
        }
        .comment-list::-webkit-scrollbar-track {
            background: rgba(154, 107, 47, 0.1);
            border-radius: 3px;
        }
        .comment-list::-webkit-scrollbar-thumb {
            background: rgba(154, 107, 47, 0.5);
            border-radius: 3px;
        }
        .comment-list::-webkit-scrollbar-thumb:hover {
            background: rgba(154, 107, 47, 0.8);
        }

        /* Utterances 容器 */
        #utterances-container {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #9a6b2f;
            border-radius: 4px;
            padding: 20px;
            min-height: 200px;
        }

        /* Utterances 加载前的提示文字 */
        #utterances-container::before {
            content: '正在召唤祈祷室...';
            display: block;
            text-align: center;
            color: #9a6b2f;
            font-size: 14px;
            letter-spacing: 2px;
            padding: 40px 0;
        }

        /* 加载完成后隐藏提示文字（Utterances 会插入 iframe） */
        #utterances-container:has(iframe)::before {
            display: none;
        }

        /* 单条留言卡片
           使用 border-image 九宫格：
           原图 1258×661，切片：左右各236px、上下各219px
           slice 值用原图像素，border-image-width 控制显示大小 */
        .comment-card {
            padding: 24px 28px;
            position: relative;
            min-height: 200px;

            /* border-width 留够空间给边框 */
            border: 60px 70px solid transparent;
            /* border-image: 切片值(原图像素) fill 填充中间 / 显示宽度(上下 左右) / outset 0 / 拉伸方式 */
            border-image: url('comment-bg.jpg') 219 236 fill / 60px 70px / 0 stretch;
        }

        /* 卡片内内容层级比装饰高，不被遮挡 */
        .comment-header,
        .comment-body,
        .comment-actions,
        .reply-list,
        .reply-composer {
            position: relative;
            z-index: 2;
        }

        /* 加载中提示 */
        .loading-hint {
            text-align: center;
            padding: 40px 0;
            color: #999;
            font-size: 14px;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #222;
            border-radius: 4px;
        }

        /* 留言头部：头像 + 用户名 + 时间 */
        .comment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        /* 头像链接：去掉默认下划线 */
        .avatar-link {
            display: block;
            line-height: 0;
            text-decoration: none;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid #333;
            background: #eee;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-meta {
            flex: 1;
        }

        .comment-author {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #111;
            margin: 0 0 4px;
        }

        .comment-time {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
        }

        /* 留言正文 */
        .comment-body {
            font-size: 15px;
            line-height: 1.8;
            color: #333;
            margin: 0 0 12px;
            white-space: pre-wrap;    /* 保留换行和空格 */
            word-break: break-word;
            transform: scaleX(0.85);           /* 横向压缩，细长感 */
            transform-origin: left center;     /* 从左侧对齐 */
            letter-spacing: 1px;
        }

        /* 留言底部操作栏：点赞 + 回复 */
        .comment-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }

        /* 回复按钮 */
        .reply-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            letter-spacing: 2px;
            color: #9a6b2f;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .reply-btn:hover {
            color: #111;
            background: rgba(0, 0, 0, 0.05);
        }

        /* 阅览次数：蜡烛图标
           根据评论创建时间自动计算，越老的评论数字越大 */
        .like-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            letter-spacing: 2px;
            color: #9a6b2f;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .like-btn:hover {
            color: #111;
            background: rgba(0, 0, 0, 0.05);
        }

        .like-icon {
            font-size: 20px;
            transition: transform 0.2s;
            display: inline-block;
        }

        .like-btn:hover .like-icon {
            transform: scale(1.15);
        }

        .like-count {
            min-width: 20px;
            text-align: center;
        }

        /* ===== Utterances 弹窗（用于发新留言）===== */
        .utterances-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .utterances-modal-content {
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid #9a6b2f;
            border-radius: 8px;
            padding: 30px 24px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            text-align: center;
        }

        .utterances-title {
            margin: 0 0 8px;
            font-size: 22px;
            letter-spacing: 8px;
            color: #9a6b2f;
        }

        .utterances-hint {
            font-size: 12px;
            color: #9a6b2f;
            letter-spacing: 2px;
            margin: 0 0 16px;
        }

        .utterances-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #9a6b2f;
            line-height: 1;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .utterances-close:hover {
            color: #7a5628;
        }

        /* ===== 回复弹窗专用样式 ===== */
        .reply-original {
            background: rgba(0, 0, 0, 0.04);
            border-left: 3px solid #9a6b2f;
            padding: 12px 16px;
            margin: 0 0 16px;
            text-align: left;
            border-radius: 0 4px 4px 0;
            font-size: 13px;
        }

        .reply-original .reply-original-author {
            font-weight: 700;
            color: #9a6b2f;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .reply-original .reply-original-body {
            color: #555;
            line-height: 1.6;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .reply-input {
            width: 100%;
            min-height: 100px;
            border: 1px solid #9a6b2f;
            border-radius: 4px;
            padding: 12px;
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #222;
            text-align: left;
            transition: border-color 0.2s;
        }

        .reply-input:focus {
            border-color: #9a6b2f;
        }

        .reply-modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .reply-submit-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s;
        }

        .reply-submit-btn:hover {
            transform: scale(1.1);
        }

        .reply-submit-btn img {
            height: 32px;
            width: auto;
        }

        /* ===== 回复区（主留言下的回复列表） ===== */
        .reply-list {
            margin-top: 14px;
            padding-left: 16px;
            border-left: 2px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reply-item {
            background: rgba(250, 250, 250, 0.7);
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 14px;
        }

        .reply-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .reply-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #999;
            overflow: hidden;
            background: #eee;
        }

        .reply-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
        }

        .reply-author {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #222;
        }

        .reply-time {
            font-size: 11px;
            color: #999;
            margin-left: auto;
        }

        .reply-body {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            transform: scaleX(0.85);           /* 横向压缩，和主留言保持一致 */
            transform-origin: left center;
            letter-spacing: 1px;
        }

        /* 回复输入框：点击"回复"按钮后展开 */
        .reply-composer {
            display: none;    /* 默认隐藏 */
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
        }

        .reply-composer.active {
            display: block;   /* 展开时显示 */
        }

        .reply-composer textarea {
            width: 100%;
            min-height: 60px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px 10px;
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            background: #fff;
            color: #222;
        }

        .reply-composer textarea:focus {
            border-color: #111;
        }

        .reply-composer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }

        .reply-cancel-btn,
        .reply-send-btn {
            padding: 5px 12px;
            border: 1px solid #999;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            font-size: 12px;
            letter-spacing: 2px;
            color: #555;
            transition: all 0.2s;
        }

        .reply-cancel-btn:hover {
            border-color: #111;
            color: #111;
        }

        .reply-send-btn {
            border-color: #111;
            color: #111;
        }

        .reply-send-btn:hover {
            background: #111;
            color: #fff;
        }

        /* ===== 底部铭文：和首页同格式横条 ===== */
        .bottom-inscription {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 0;
            border-top: 1px solid #9a6b2f;
            text-align: center;
        }

        .inscription-text {
            font-size: 18px;
            letter-spacing: 6px;
            line-height: 1.5;
            color: #9a6b2f;
            margin: 0 auto;
            font-weight: bold;
            max-width: 700px;
        }

        .signature {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #9a6b2f;
            width: 60px;
            margin-left: auto;
            margin-right: auto;
        }

        .signature span {
            font-size: 10px;
            color: #9a6b2f;
        }

        /* ===== 响应式：移动端 ===== */

        @media (max-width: 640px) {
            .page-wrapper {
                padding: 20px 14px 60px;
            }
            .page-header h1 {
                font-size: 24px;
                letter-spacing: 6px;
            }
            .page-header::before,
            .page-header::after {
                width: 30px;
            }
            .back-home {
                top: 14px;
                left: 14px;
                font-size: 12px;
            }
            .composer {
                padding: 12px;
                top: 10px;
            }
            .comment-card {
                padding: 14px 16px;
            }
            .inscription-text {
                font-size: 14px;
                letter-spacing: 4px;
            }
        }

        /* 尊重用户的减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- 页面整体布局 -->
    <div class="page-layout">

        <!-- 中间内容区 -->
        <div class="page-wrapper">

        <!-- 返回首页 -->
        <a href="../index.html" class="back-home">« 返回</a>

        <!-- 页面标题 -->
        <header class="page-header fly-in">
            <h1><span class="scale-x">大祈祷室</span></h1>
            <div class="subtitle"><span class="scale-x">在此向帝皇倾诉，留下你的印记</span></div>
        </header>

        <!-- ===== 顶部发帖区 ===== -->
        <div class="composer fly-in">
            <textarea placeholder="写下你的祷词..." id="mainInput"></textarea>
            <div class="composer-footer">
                <span class="composer-hint">以帝皇之名发言</span>
                <button class="send-btn" id="sendBtn" title="祈祷">
                    <img src="guest-iris.png" alt="祈祷">
                </button>
            </div>
        </div>

        <!-- ===== 留言列表（从新到旧） =====
             数据源：GitHub Issues #1 的评论
             渲染方式：调用 GitHub API 读取，自己渲染成卡片 -->
        <div class="comment-list" id="commentList">

            <!-- 加载中提示（API 返回后会被替换） -->
            <div class="loading-hint card-fly-in" id="loadingHint">
                <span>正在召唤祈祷室...</span>
            </div>

            <!-- 自定义留言卡片会通过 JS 注入到这里 -->
            <div id="commentCards"></div>

        </div>

        <!-- ===== 隐藏的 Utterances 容器 =====
             不直接显示，点击"发留言"时弹窗打开
             用于让用户登录 GitHub 后发布新留言 -->
        <div id="utterancesModal" class="utterances-modal" style="display:none;">
            <div class="utterances-modal-content">
                <button class="utterances-close" id="utterancesClose" aria-label="关闭">✕</button>
                <h3 class="utterances-title"><span class="scale-x">登 录 并 祈 祷</span></h3>
                <p class="utterances-hint">通过 GitHub 账号登录后，即可发布留言</p>
                <div id="utterances-container"></div>
            </div>
        </div>

        <!-- ===== 回复弹窗 =====
             点击"回复"按钮后弹出，显示原留言摘要 + 输入框 -->
        <div id="replyModal" class="utterances-modal" style="display:none;">
            <div class="utterances-modal-content">
                <button class="utterances-close" id="replyClose" aria-label="关闭">✕</button>
                <h3 class="utterances-title"><span class="scale-x">回 复 祷 文</span></h3>
                <!-- 被回复的原留言摘要 -->
                <div id="replyOriginal" class="reply-original"></div>
                <!-- 回复输入框 -->
                <textarea id="replyInput" class="reply-input" placeholder="写下你的回复..."></textarea>
                <div class="reply-modal-footer">
                    <span class="utterances-hint">回复内容将自动引用原作者</span>
                    <button class="reply-submit-btn" id="replySubmit" title="祈祷">
                        <img src="guest-iris.png" alt="祈祷">
                    </button>
                </div>
            </div>
        </div>

        </div><!-- /page-wrapper -->
    </div><!-- /page-layout -->

    <!-- ===== JavaScript ===== -->
    <script>
        (function () {
            'use strict';

            // =====================================================
            // 配置区
            // =====================================================
            var CONFIG = {
                owner:        '0x52686561',              // GitHub 用户名
                repo:         '0x52686561.github.io',     // 仓库名
                issueNumber:  1,                          // 用于存储留言的 Issue 编号
                perPage:      100                         // 每页加载多少条评论（GitHub 单次最多100）
            };

            // 评论区 API 地址（公开读取，无需 token）
            var API_URL = 'https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo
                        + '/issues/' + CONFIG.issueNumber + '/comments?per_page=' + CONFIG.perPage
                        + '&sort=created&direction=desc';   // 按创建时间倒序（新的在前）

            // Issue 页面地址（点击头像/用户名时跳转）
            var ISSUE_URL = 'https://github.com/' + CONFIG.owner + '/' + CONFIG.repo
                          + '/issues/' + CONFIG.issueNumber;

            // =====================================================
            // 工具函数
            // =====================================================

            /* HTML 转义：防止评论里的 < > & " 等字符被当成 HTML 解析
               避免 XSS 攻击，也避免显示乱码 */
            function escapeHtml(str) {
                if (!str) return '';
                var div = document.createElement('div');
                div.textContent = str;       // 自动转义
                return div.innerHTML;
            }

            /* 时间格式化
               把 "2026-07-24T14:30:00Z" 转成 "2026-07-24 14:30" */
            function formatTime(isoTime) {
                if (!isoTime) return '';
                var d = new Date(isoTime);
                if (isNaN(d.getTime())) return '';   // 解析失败返回空
                var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                     + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            }

            /* 相对时间：把 ISO 时间转成"3小时前"这种格式
               如果超过30天就显示绝对时间 */
            function relativeTime(isoTime) {
                if (!isoTime) return '';
                var now  = Date.now();
                var then = new Date(isoTime).getTime();
                if (isNaN(then)) return '';
                var diff = (now - then) / 1000;   // 秒

                if (diff < 60)    return '刚刚';
                if (diff < 3600)  return Math.floor(diff / 60) + '分钟前';
                if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
                if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
                return formatTime(isoTime);   // 超过30天显示绝对时间
            }

            /* 计算阅览次数：根据评论创建时间自动生成
               公式：基础数(100) + 时间加成(每小时+2) + 随机波动(±50)
               越老的评论数字越大，模拟真实阅览增长 */
            function calculateViews(createdAt) {
                if (!createdAt) return 0;
                var now = Date.now();
                var then = new Date(createdAt).getTime();
                if (isNaN(then)) return 100;

                var hoursOld = (now - then) / 1000 / 60 / 60;   // 评论发布了多少小时
                var base = 100;                                // 基础阅览数
                var timeBonus = Math.floor(hoursOld * 2);      // 时间加成：每小时 +2
                var variance = Math.floor(Math.random() * 50); // 随机波动：0~49

                return base + timeBonus + variance;
            }

            function randomPick(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            // 纯洁印记图片列表
            var SEAL_IMAGES = [
                'seal1.png',
                'seal2.png',
                'seal3.png'
            ];

            function randomBetween(min, max) {
                return Math.random() * (max - min) + min;
            }

            // 在每张卡片右侧随机贴1-2个纯洁印记
            function generateCardSeals() {
                var cards = document.querySelectorAll('.comment-card');
                cards.forEach(function(card) {
                    var sealCount = Math.floor(Math.random() * 2) + 1;   // 1~2个印记
                    for (var i = 0; i < sealCount; i++) {
                        var img = document.createElement('img');
                        img.className = 'card-seal';
                        img.src = randomPick(SEAL_IMAGES);
                        img.alt = '';
                        img.draggable = false;

                        // 只贴在卡片右侧，垂直位置随机
                        var top = randomBetween(5, 75);
                        var size = randomBetween(40, 84);

                        img.style.top = top + '%';
                        img.style.width = size + 'px';
                        img.style.transform = 'rotate(' + randomBetween(-15, 15) + 'deg)';

                        card.appendChild(img);
                    }
                });
            }

            // =====================================================
            // 调用 GitHub API 获取评论
            // =====================================================
            function fetchComments() {
                return fetch(API_URL, {
                    headers: {
                        'Accept': 'application/vnd.github+json'   // 必须加，否则不返回 reactions 字段
                    }
                }).then(function (res) {
                    if (!res.ok) {
                        throw new Error('GitHub API 返回错误：' + res.status);
                    }
                    return res.json();
                });
            }

            // =====================================================
            // 渲染单条留言卡片
            // =====================================================
            function renderCommentCard(comment, index) {
                // 提取关键字段
                var author     = comment.user.login;
                var avatarUrl  = comment.user.avatar_url;
                var body       = comment.body || '';
                var time       = comment.created_at;
                var views      = calculateViews(time);      // 阅览次数（根据时间计算）

                // 卡片 HTML 模板
                return ''
                    + '<article class="comment-card card-fly-in" style="transition-delay:' + (index * 60) + 'ms;">'

                    //   头部：头像 + 用户名 + 时间
                    +   '<div class="comment-header">'
                    +     '<a href="https://github.com/' + encodeURIComponent(author) + '" target="_blank" rel="noopener" class="avatar-link">'
                    +       '<div class="avatar">'
                    +         '<img src="' + escapeHtml(avatarUrl) + '" alt="' + escapeHtml(author) + '" loading="lazy">'
                    +       '</div>'
                    +     '</a>'
                    +     '<div class="comment-meta">'
                    +       '<p class="comment-author"><span class="scale-x">' + escapeHtml(author) + '</span></p>'
                    +       '<span class="comment-time" title="' + formatTime(time) + '">' + relativeTime(time) + '</span>'
                    +     '</div>'
                    +   '</div>'

                    //   正文
                    +   '<p class="comment-body">' + escapeHtml(body) + '</p>'

                    //   操作栏：蜡烛阅览次数 + 回复（打开回复弹窗）
                    +   '<div class="comment-actions">'
                    +     '<span class="like-btn" title="祷文被阅览次数">'
                    +       '<span class="like-icon">🕯︎</span>'
                    +       '<span class="like-count">' + views + '</span>'
                    +     '</span>'
                    +     '<button type="button" class="reply-btn" title="回复此祷文"'
                    +       ' data-author="' + escapeHtml(author) + '"'
                    +       ' data-body="' + escapeHtml(body) + '"'
                    +       '>'
                    +       '<span>🗨︎</span>'
                    +     '</button>'
                    +   '</div>'
                    + '</article>';
            }

            // =====================================================
            // 渲染整个留言列表
            // =====================================================
            function renderComments(comments) {
                var container = document.getElementById('commentCards');
                var loadingHint = document.getElementById('loadingHint');

                // 隐藏加载提示
                if (loadingHint) loadingHint.style.display = 'none';

                if (!comments || comments.length === 0) {
                    // 暂无留言
                    container.innerHTML = ''
                        + '<div class="loading-hint card-fly-in entered">'
                        +   '<span>祈祷室空寂无声，成为第一位祈祷者。</span>'
                        + '</div>';
                    return;
                }

                // 拼接所有卡片 HTML
                var html = comments.map(function (c, i) {
                    return renderCommentCard(c, i);
                }).join('');

                container.innerHTML = html;

                // 生成卡片上的纯洁印记装饰
                generateCardSeals();

                // 绑定所有回复按钮的点击事件
                bindReplyButtons();

                // 用 IntersectionObserver 监听卡片是否进入视口，实现滚动淡入淡出
                var observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('entered');
                        } else {
                            // 离开视口时移除，下次再进入会再次淡入
                            entry.target.classList.remove('entered');
                        }
                    });
                }, {
                    root: container,           // 以留言列表为视口
                    threshold: 0.1,            // 卡片有10%进入视口就触发
                    rootMargin: '0px 0px -10% 0px'   // 稍微提前触发
                });

                var cards = container.querySelectorAll('.card-fly-in');
                cards.forEach(function (card) {
                    observer.observe(card);
                });
            }

            // =====================================================
            // 加载失败时显示
            // =====================================================
            function renderError(msg) {
                var container = document.getElementById('commentCards');
                var loadingHint = document.getElementById('loadingHint');
                if (loadingHint) loadingHint.style.display = 'none';

                container.innerHTML = ''
                    + '<div class="loading-hint card-fly-in entered">'
                    +   '<span>祈祷室召唤失败：' + escapeHtml(msg) + '</span><br>'
                    +   '<a href="' + ISSUE_URL + '" target="_blank" rel="noopener" style="color:#555;text-decoration:underline;margin-top:8px;display:inline-block;">前往 GitHub 查看</a>'
                    + '</div>';
            }

            // =====================================================
            // 加载留言数据 + 渲染
            // =====================================================
            function loadComments() {
                fetchComments()
                    .then(function (comments) {
                        renderComments(comments);
                    })
                    .catch(function (err) {
                        renderError(err.message);
                    });
            }

            // =====================================================
            // Utterances：放在弹窗里，用于发新留言
            // 提前在页面加载时就初始化，用户点开弹窗时已经准备好
            // =====================================================
            function initUtterances() {
                var container = document.getElementById('utterances-container');
                if (!container) return;

                var script = document.createElement('script');
                script.src = 'https://utteranc.es/client.js';
                script.setAttribute('repo', CONFIG.owner + '/' + CONFIG.repo);
                script.setAttribute('issue-number', CONFIG.issueNumber);
                script.setAttribute('theme', 'github-light');
                script.setAttribute('label', '大祈祷室');
                script.setAttribute('crossorigin', 'anonymous');
                script.async = true;

                container.appendChild(script);
            }

            // 打开 Utterances 弹窗
            function openUtterancesModal() {
                var modal = document.getElementById('utterancesModal');
                if (modal) {
                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';   // 禁止背景滚动
                }
            }

            // 关闭 Utterances 弹窗
            function closeUtterancesModal() {
                var modal = document.getElementById('utterancesModal');
                if (modal) {
                    modal.style.display = 'none';
                    document.body.style.overflow = '';
                }
            }

            // =====================================================
            // 顶部输入框：点击 iris.png 后
            //   1. 把内容复制到剪贴板
            //   2. 弹出 Utterances 弹窗让用户登录后粘贴发布
            // =====================================================
            function initSendButton() {
                var sendBtn  = document.getElementById('sendBtn');
                var mainInput = document.getElementById('mainInput');
                var closeBtn = document.getElementById('utterancesClose');
                if (!sendBtn) return;

                sendBtn.addEventListener('click', function () {
                    var text = mainInput.value.trim();

                    // 如果有内容，先复制到剪贴板
                    if (text) {
                        if (navigator.clipboard) {
                            navigator.clipboard.writeText(text).then(function () {
                                alert('祷词已复制到剪贴板。\n请在弹出的窗口中登录 GitHub 后粘贴发布。');
                                openUtterancesModal();
                            }).catch(function () {
                                // 复制失败，仍然打开弹窗
                                openUtterancesModal();
                            });
                        } else {
                            // 浏览器不支持 clipboard API，直接打开弹窗
                            openUtterancesModal();
                        }
                        mainInput.value = '';
                    } else {
                        // 没写内容，直接打开弹窗
                        openUtterancesModal();
                    }
                });

                // 关闭弹窗（关闭后延迟刷新评论列表，让用户看到刚发的新留言）
                if (closeBtn) {
                    closeBtn.addEventListener('click', function () {
                        closeUtterancesModal();
                        setTimeout(loadComments, 2000);   // 2秒后刷新（给 GitHub API 同步时间）
                    });
                }

                // 点弹窗遮罩关闭
                var modal = document.getElementById('utterancesModal');
                if (modal) {
                    modal.addEventListener('click', function (e) {
                        if (e.target === modal) closeUtterancesModal();
                    });
                }
            }

            // =====================================================
            // 回复弹窗
            //   点击回复按钮 → 显示原留言摘要 + 输入框
            //   提交后自动加上 @原作者 引用，复制到剪贴板，打开 Utterances 发布
            // =====================================================

            // 当前被回复的留言信息
            var replyTarget = { author: '', body: '' };

            // 绑定所有回复按钮的点击事件
            function bindReplyButtons() {
                var btns = document.querySelectorAll('.reply-btn');
                btns.forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        replyTarget.author = btn.getAttribute('data-author') || '';
                        replyTarget.body   = btn.getAttribute('data-body') || '';
                        openReplyModal();
                    });
                });
            }

            function openReplyModal() {
                var modal = document.getElementById('replyModal');
                var originalBox = document.getElementById('replyOriginal');
                var input = document.getElementById('replyInput');
                if (!modal) return;

                // 显示原留言摘要
                if (originalBox) {
                    originalBox.innerHTML = ''
                        + '<div class="reply-original-author">@' + escapeHtml(replyTarget.author) + '</div>'
                        + '<div class="reply-original-body">' + escapeHtml(replyTarget.body) + '</div>';
                }

                // 清空输入框
                if (input) input.value = '';

                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }

            function closeReplyModal() {
                var modal = document.getElementById('replyModal');
                if (modal) {
                    modal.style.display = 'none';
                    document.body.style.overflow = '';
                }
            }

            function initReplyModal() {
                var closeBtn = document.getElementById('replyClose');
                var submitBtn = document.getElementById('replySubmit');
                var input = document.getElementById('replyInput');
                var modal = document.getElementById('replyModal');

                // 关闭按钮
                if (closeBtn) {
                    closeBtn.addEventListener('click', function () {
                        closeReplyModal();
                    });
                }

                // 点遮罩关闭
                if (modal) {
                    modal.addEventListener('click', function (e) {
                        if (e.target === modal) closeReplyModal();
                    });
                }

                // 提交回复：把内容加上 @原作者 引用，复制到剪贴板，打开 Utterances
                if (submitBtn) {
                    submitBtn.addEventListener('click', function () {
                        var text = input ? input.value.trim() : '';
                        if (!text) {
                            alert('请先写下你的回复。');
                            return;
                        }

                        // 自动加上引用格式：> @原作者 \n 回复内容
                        var replyText = '> @' + replyTarget.author + '\n\n' + text;

                        if (navigator.clipboard) {
                            navigator.clipboard.writeText(replyText).then(function () {
                                alert('回复已复制到剪贴板。\n请在弹出的窗口中登录 GitHub 后粘贴发布。');
                                closeReplyModal();
                                openUtterancesModal();
                            }).catch(function () {
                                closeReplyModal();
                                openUtterancesModal();
                            });
                        } else {
                            closeReplyModal();
                            openUtterancesModal();
                        }
                    });
                }
            }

            // =====================================================
            // 入场动画：让页面元素依次出现
            // =====================================================
            function initEntranceAnimations() {
                var header = document.querySelector('.page-header.fly-in');
                if (header) {
                    requestAnimationFrame(function () { header.classList.add('entered'); });
                }

                setTimeout(function () {
                    var composer = document.querySelector('.composer.fly-in');
                    if (composer) composer.classList.add('entered');
                }, 150);

                setTimeout(function () {
                    var hint = document.querySelector('.loading-hint.card-fly-in');
                    if (hint) hint.classList.add('entered');
                }, 350);
            }

            // =====================================================
            // 页面加载完成后初始化
            // =====================================================
            document.addEventListener('DOMContentLoaded', function () {
                initUtterances();
                initSendButton();
                initReplyModal();        // 初始化回复弹窗
                initEntranceAnimations();
                loadComments();

                // 按 Esc 关闭任意弹窗
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') {
                        closeUtterancesModal();
                        closeReplyModal();
                    }
                });
            });

        })();
    </script>

</body>
