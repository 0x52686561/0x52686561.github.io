<!DOCTYPE html>
<!-- ============================================================
     大祈祷室（留言页）
     风格：黑白线稿 + 祷文卷轴 + 战锤40K神圣感
     ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大祈祷室 | 神圣殉道录</title>

    <!-- 预连接字体服务器，加速加载 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap">

    <style>
        /* ===== 全局重置 ===== */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;   /* 最小高度占满，内容多时可以撑开 */
            background-color: #fafafa;
            background-image: url('../bg.jpg');   /* 背景图和首页共用，../ 表示上一级目录 */
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            color: #111;
            font-family: 'Noto Serif SC', serif;
        }

        /* 横向压缩工具类，和首页保持一致 */
        .scale-x {
            transform: scaleX(0.8);
            transform-origin: center;
            display: inline-block;
        }

        /* ===== 入场动画 =====
           两种风格：
           1. .fly-in     —— 页面整体淡入（标题、输入框、页脚）
           2. .card-fly-in —— 留言卡片飞入（更大的位移 + 轻微缩放） */

        /* 1. 淡入：从下方 20px 微微上浮 + 透明度变化 */
        .fly-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease,
                        transform 0.6s ease;
        }
        .fly-in.entered {
            opacity: 1;
            transform: translateY(0);
        }

        /* 2. 卡片飞入：从下方 60px 飞进来，带轻微缩放，更有"飞"的感觉 */
        .card-fly-in {
            opacity: 0;
            transform: translateY(60px) scale(0.96);
            transition: opacity 0.8s cubic-bezier(0.22, 0.61, 0.36, 1),
                        transform 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .card-fly-in.entered {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ===== 页面整体布局：中间内容 + 两侧装饰 =====
           .page-layout 是最外层，左右各放一个装饰柱，中间是内容
           窄屏时两侧装饰自动隐藏 */
        .page-layout {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* 左右两侧装饰柱 */
        .side-decoration {
            position: fixed;           /* 固定，不随内容滚动 */
            top: 0;
            bottom: 0;
            width: 200px;              /* 装饰区宽度 */
            pointer-events: none;      /* 不阻挡鼠标点击 */
            z-index: 1;
            overflow: hidden;
        }
        .side-decoration.left  { left: 0; }
        .side-decoration.right { right: 0; }

        /* 装饰元素通用样式：图片 + 文字都用这个 */
        .deco-item {
            position: absolute;
            opacity: 0.15;             /* 默认很淡，不抢主内容视线 */
            transition: opacity 0.3s;
        }

        /* 纯洁印记图片 */
        .deco-seal {
            max-width: 100%;
            height: auto;
        }

        /* 竖排经文文字 */
        .deco-text {
            writing-mode: vertical-rl;   /* 竖排，从右到左 */
            text-orientation: upright;   /* 文字直立 */
            font-size: 14px;
            letter-spacing: 4px;
            color: #111;
            white-space: nowrap;
            line-height: 1.6;
        }

        /* ===== 页面整体容器：像一页展开的古老祷文卷轴 ===== */
        .page-wrapper {
            max-width: 720px;              /* 最大宽度，太宽不好读 */
            width: 100%;
            margin: 0 auto;                /* 水平居中 */
            padding: 40px 24px 80px;       /* 上下左右内边距 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;                    /* 比两侧装饰高 */
        }

        /* ===== 页面标题 ===== */
        .page-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            position: relative;
        }

        .page-header h1 {
            font-size: 32px;
            letter-spacing: 10px;
            margin: 0 0 10px;
            font-weight: 700;
        }

        .page-header .subtitle {
            font-size: 13px;
            letter-spacing: 4px;
            color: #666;
        }

        /* 标题两侧的装饰线（鸢尾花位置用横线替代，简洁） */
        .page-header::before,
        .page-header::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 60px;
            height: 1px;
            background: #333;
        }
        .page-header::before { left: 0; }
        .page-header::after  { right: 0; }

        /* 返回首页链接 */
        .back-home {
            position: absolute;
            top: 20px;
            left: 24px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .back-home:hover {
            border-bottom-color: #333;
        }

        /* ===== 输入区：顶部固定，类似微博发帖框 ===== */
        .composer {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #222;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 30px;
            position: sticky;      /* 滚动时贴在顶部 */
            top: 16px;
            z-index: 100;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .composer textarea {
            width: 100%;
            min-height: 80px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px 12px;
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;   /* 只允许垂直方向拖拽放大 */
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
            color: #222;
        }

        .composer textarea:focus {
            border-color: #111;
        }

        .composer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .composer-hint {
            font-size: 12px;
            color: #999;
            letter-spacing: 1px;
        }

        /* 发送按钮：只用 iris.png 图标，无边框无文字 */
        .send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .send-btn img {
            height: 32px;
            width: auto;
        }

        /* ===== 留言列表：时间线式，从新到旧 ===== */
        .comment-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;       /* 每条留言之间的间距 */
        }

        /* Utterances 容器：让它看起来像一张留言卡片 */
        #utterances-container {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #222;
            border-radius: 4px;
            padding: 20px;
            min-height: 200px;   /* 加载前占位高度 */
        }

        /* Utterances 加载前的提示文字 */
        #utterances-container::before {
            content: '正在召唤祈祷室...';
            display: block;
            text-align: center;
            color: #999;
            font-size: 14px;
            letter-spacing: 2px;
            padding: 40px 0;
        }

        /* 加载完成后隐藏提示文字（Utterances 会插入 iframe） */
        #utterances-container:has(iframe)::before {
            display: none;
        }

        /* 单条留言卡片
           使用 comment-bg.png 作为背景，叠加半透明白色遮罩保证文字可读 */
        .comment-card {
            background-color: rgba(255, 255, 255, 0.92);   /* 备用底色 */
            background-image: url('comment-bg.png');
            background-size: cover;            /* 背景图拉伸铺满 */
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 18px 20px;
            position: relative;
            overflow: hidden;                 /* 让 ::before 遮罩不溢出圆角 */
        }

        /* 半透明白色遮罩层：盖在背景图上方、文字下方，保护可读性 */
        .comment-card .bg-overlay {
            position: absolute;
            inset: 0;                        /* 撑满整个卡片 */
            background: rgba(255, 255, 255, 0.75);
            z-index: 0;                       /* 在背景图之上 */
            pointer-events: none;             /* 不阻挡点击 */
        }

        /* 卡片内的实际内容（header/body/actions）都要在遮罩之上 */
        .comment-header,
        .comment-body,
        .comment-actions,
        .reply-list,
        .reply-composer {
            position: relative;
            z-index: 1;
        }

        /* 加载中提示 */
        .loading-hint {
            text-align: center;
            padding: 40px 0;
            color: #999;
            font-size: 14px;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #222;
            border-radius: 4px;
        }

        /* 留言卡片顶部的装饰角（左上、右下，增加仪式感） */
        .comment-card::before,
        .comment-card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 1px solid #333;
        }
        .comment-card::before {
            top: 6px;
            left: 6px;
            border-right: none;
            border-bottom: none;
        }
        .comment-card::after {
            bottom: 6px;
            right: 6px;
            border-left: none;
            border-top: none;
        }

        /* 留言头部：头像 + 用户名 + 时间 */
        .comment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        /* 头像链接：去掉默认下划线 */
        .avatar-link {
            display: block;
            line-height: 0;
            text-decoration: none;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid #333;
            background: #eee;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);   /* 头像转黑白，和整体风格统一 */
        }

        .comment-meta {
            flex: 1;
        }

        .comment-author {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #111;
            margin: 0 0 4px;
        }

        .comment-time {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
        }

        /* 留言正文 */
        .comment-body {
            font-size: 15px;
            line-height: 1.8;
            color: #333;
            margin: 0 0 12px;
            white-space: pre-wrap;    /* 保留换行和空格 */
            word-break: break-word;
            transform: scaleX(0.85);           /* 横向压缩，细长感 */
            transform-origin: left center;     /* 从左侧对齐 */
            letter-spacing: 1px;
        }

        /* 留言底部操作栏：点赞 + 回复 */
        .comment-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }

        /* 回复按钮 */
        .reply-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            letter-spacing: 2px;
            color: #555;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .reply-btn:hover {
            color: #111;
            background: rgba(0, 0, 0, 0.05);
        }

        /* 点赞按钮：蜡烛图标
           点击会跳转到 GitHub 该评论页面让用户登录后点赞
           （前端无法安全存储 token，所以用跳转方式） */
        .like-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            letter-spacing: 2px;
            color: #555;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            text-decoration: none;   /* 用 <a> 标签时去掉下划线 */
        }

        .like-btn:hover {
            color: #111;
            background: rgba(0, 0, 0, 0.05);
        }

        .like-icon {
            font-size: 20px;
            transition: transform 0.2s;
            display: inline-block;
        }

        .like-btn:hover .like-icon {
            transform: scale(1.15);
        }

        .like-count {
            min-width: 20px;
            text-align: center;
        }

        /* ===== Utterances 弹窗（用于发新留言）===== */
        .utterances-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .utterances-modal-content {
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid #222;
            border-radius: 8px;
            padding: 30px 24px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            text-align: center;
        }

        .utterances-title {
            margin: 0 0 8px;
            font-size: 22px;
            letter-spacing: 8px;
        }

        .utterances-hint {
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
            margin: 0 0 16px;
        }

        .utterances-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #555;
            line-height: 1;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .utterances-close:hover {
            color: #111;
        }

        /* ===== 回复区（主留言下的回复列表） ===== */
        .reply-list {
            margin-top: 14px;
            padding-left: 16px;
            border-left: 2px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reply-item {
            background: rgba(250, 250, 250, 0.7);
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 14px;
        }

        .reply-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .reply-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #999;
            overflow: hidden;
            background: #eee;
        }

        .reply-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
        }

        .reply-author {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #222;
        }

        .reply-time {
            font-size: 11px;
            color: #999;
            margin-left: auto;
        }

        .reply-body {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            transform: scaleX(0.85);           /* 横向压缩，和主留言保持一致 */
            transform-origin: left center;
            letter-spacing: 1px;
        }

        /* 回复输入框：点击"回复"按钮后展开 */
        .reply-composer {
            display: none;    /* 默认隐藏 */
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
        }

        .reply-composer.active {
            display: block;   /* 展开时显示 */
        }

        .reply-composer textarea {
            width: 100%;
            min-height: 60px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px 10px;
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            background: #fff;
            color: #222;
        }

        .reply-composer textarea:focus {
            border-color: #111;
        }

        .reply-composer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }

        .reply-cancel-btn,
        .reply-send-btn {
            padding: 5px 12px;
            border: 1px solid #999;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            font-size: 12px;
            letter-spacing: 2px;
            color: #555;
            transition: all 0.2s;
        }

        .reply-cancel-btn:hover {
            border-color: #111;
            color: #111;
        }

        .reply-send-btn {
            border-color: #111;
            color: #111;
        }

        .reply-send-btn:hover {
            background: #111;
            color: #fff;
        }

        /* ===== 底部铭文：和首页同格式横条 ===== */
        .bottom-inscription {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 0;
            border-top: 1px solid #ddd;
            text-align: center;
        }

        .inscription-text {
            font-size: 18px;
            letter-spacing: 6px;
            line-height: 1.5;
            color: #222;
            margin: 0 auto;
            font-weight: bold;
            max-width: 700px;
        }

        .signature {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #ccc;
            width: 60px;
            margin-left: auto;
            margin-right: auto;
        }

        .signature span {
            font-size: 10px;
            color: #666;
            letter-spacing: 2px;
        }

        /* ===== 响应式：移动端 ===== */
        @media (max-width: 1100px) {
            /* 窄屏时两侧装饰缩小，让出空间给内容 */
            .side-decoration { width: 120px; }
        }

        @media (max-width: 900px) {
            /* 更窄时直接隐藏两侧装饰 */
            .side-decoration { display: none; }
        }

        @media (max-width: 640px) {
            .page-wrapper {
                padding: 20px 14px 60px;
            }
            .page-header h1 {
                font-size: 24px;
                letter-spacing: 6px;
            }
            .page-header::before,
            .page-header::after {
                width: 30px;
            }
            .back-home {
                top: 14px;
                left: 14px;
                font-size: 12px;
            }
            .composer {
                padding: 12px;
                top: 10px;
            }
            .comment-card {
                padding: 14px 16px;
            }
            .inscription-text {
                font-size: 14px;
                letter-spacing: 4px;
            }
        }

        /* 尊重用户的减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- 页面整体布局：中间内容 + 两侧装饰 -->
    <div class="page-layout">

        <!-- 左侧装饰柱：纯洁印记 + 竖排经文
             所有元素通过 JS 随机生成位置、大小、旋转角度 -->
        <aside class="side-decoration left" id="decoLeft"></aside>

        <!-- 右侧装饰柱 -->
        <aside class="side-decoration right" id="decoRight"></aside>

        <!-- 中间内容区 -->
        <div class="page-wrapper">

        <!-- 返回首页 -->
        <a href="../index.html" class="back-home">« 返回</a>

        <!-- 页面标题 -->
        <header class="page-header fly-in">
            <h1><span class="scale-x">大祈祷室</span></h1>
            <div class="subtitle"><span class="scale-x">在此向帝皇倾诉，留下你的印记</span></div>
        </header>

        <!-- ===== 顶部发帖区 ===== -->
        <div class="composer fly-in">
            <textarea placeholder="写下你的祷词..." id="mainInput"></textarea>
            <div class="composer-footer">
                <span class="composer-hint">以帝皇之名发言</span>
                <button class="send-btn" id="sendBtn" title="祈祷">
                    <img src="../iris.png" alt="祈祷">
                </button>
            </div>
        </div>

        <!-- ===== 留言列表（从新到旧） =====
             数据源：GitHub Issues #1 的评论
             渲染方式：调用 GitHub API 读取，自己渲染成卡片 -->
        <div class="comment-list" id="commentList">

            <!-- 加载中提示（API 返回后会被替换） -->
            <div class="loading-hint card-fly-in" id="loadingHint">
                <span>正在召唤祈祷室...</span>
            </div>

            <!-- 自定义留言卡片会通过 JS 注入到这里 -->
            <div id="commentCards"></div>

        </div>

        <!-- ===== 隐藏的 Utterances 容器 =====
             不直接显示，点击"发留言"时弹窗打开
             用于让用户登录 GitHub 后发布新留言 -->
        <div id="utterancesModal" class="utterances-modal" style="display:none;">
            <div class="utterances-modal-content">
                <button class="utterances-close" id="utterancesClose" aria-label="关闭">✕</button>
                <h3 class="utterances-title"><span class="scale-x">登 录 并 祈 祷</span></h3>
                <p class="utterances-hint">通过 GitHub 账号登录后，即可发布留言</p>
                <div id="utterances-container"></div>
            </div>
        </div>

        <!-- ===== 页脚铭文（和首页同格式横条）===== -->
        <footer class="bottom-inscription fly-in">
            <p class="inscription-text">
                <span class="scale-x">“帝皇的圣光，与你同在。”</span>
            </p>
            <div class="signature">
                <span class="scale-x">0x52686561</span>
            </div>
        </footer>

        </div><!-- /page-wrapper -->
    </div><!-- /page-layout -->

    <!-- ===== JavaScript ===== -->
    <script>
        (function () {
            'use strict';

            // =====================================================
            // 配置区
            // =====================================================
            var CONFIG = {
                owner:        '0x52686561',              // GitHub 用户名
                repo:         '0x52686561.github.io',     // 仓库名
                issueNumber:  1,                          // 用于存储留言的 Issue 编号
                perPage:      100                         // 每页加载多少条评论（GitHub 单次最多100）
            };

            // 评论区 API 地址（公开读取，无需 token）
            var API_URL = 'https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo
                        + '/issues/' + CONFIG.issueNumber + '/comments?per_page=' + CONFIG.perPage
                        + '&sort=created&direction=desc';   // 按创建时间倒序（新的在前）

            // Issue 页面地址（点击头像/用户名时跳转）
            var ISSUE_URL = 'https://github.com/' + CONFIG.owner + '/' + CONFIG.repo
                          + '/issues/' + CONFIG.issueNumber;

            // =====================================================
            // 工具函数
            // =====================================================

            /* HTML 转义：防止评论里的 < > & " 等字符被当成 HTML 解析
               避免 XSS 攻击，也避免显示乱码 */
            function escapeHtml(str) {
                if (!str) return '';
                var div = document.createElement('div');
                div.textContent = str;       // 自动转义
                return div.innerHTML;
            }

            /* 时间格式化
               把 "2026-07-24T14:30:00Z" 转成 "2026-07-24 14:30" */
            function formatTime(isoTime) {
                if (!isoTime) return '';
                var d = new Date(isoTime);
                if (isNaN(d.getTime())) return '';   // 解析失败返回空
                var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                     + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            }

            /* 相对时间：把 ISO 时间转成"3小时前"这种格式
               如果超过30天就显示绝对时间 */
            function relativeTime(isoTime) {
                if (!isoTime) return '';
                var now  = Date.now();
                var then = new Date(isoTime).getTime();
                if (isNaN(then)) return '';
                var diff = (now - then) / 1000;   // 秒

                if (diff < 60)    return '刚刚';
                if (diff < 3600)  return Math.floor(diff / 60) + '分钟前';
                if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
                if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
                return formatTime(isoTime);   // 超过30天显示绝对时间
            }

            // =====================================================
            // 调用 GitHub API 获取评论
            // =====================================================
            function fetchComments() {
                return fetch(API_URL, {
                    headers: {
                        'Accept': 'application/vnd.github+json'   // 必须加，否则不返回 reactions 字段
                    }
                }).then(function (res) {
                    if (!res.ok) {
                        throw new Error('GitHub API 返回错误：' + res.status);
                    }
                    return res.json();
                });
            }

            // =====================================================
            // 渲染单条留言卡片
            // =====================================================
            function renderCommentCard(comment, index) {
                // 提取关键字段
                var author     = comment.user.login;
                var avatarUrl  = comment.user.avatar_url;
                var body       = comment.body || '';
                var time       = comment.created_at;
                var htmlUrl    = comment.html_url;          // 该评论的 GitHub 页面地址
                var likes      = (comment.reactions && comment.reactions['+1']) || 0;   // 👍 数量

                // 卡片 HTML 模板
                return ''
                    + '<article class="comment-card card-fly-in" style="transition-delay:' + (index * 60) + 'ms;">'
                    +   '<div class="bg-overlay"></div>'   // 背景图上方的白色遮罩

                    //   头部：头像 + 用户名 + 时间
                    +   '<div class="comment-header">'
                    +     '<a href="https://github.com/' + encodeURIComponent(author) + '" target="_blank" rel="noopener" class="avatar-link">'
                    +       '<div class="avatar">'
                    +         '<img src="' + escapeHtml(avatarUrl) + '" alt="' + escapeHtml(author) + '" loading="lazy">'
                    +       '</div>'
                    +     '</a>'
                    +     '<div class="comment-meta">'
                    +       '<p class="comment-author"><span class="scale-x">' + escapeHtml(author) + '</span></p>'
                    +       '<span class="comment-time" title="' + formatTime(time) + '">' + relativeTime(time) + '</span>'
                    +     '</div>'
                    +   '</div>'

                    //   正文
                    +   '<p class="comment-body">' + escapeHtml(body) + '</p>'

                    //   操作栏：蜡烛点赞（跳转到该评论页操作）+ 回复（跳转到 Issue 页）
                    +   '<div class="comment-actions">'
                    +     '<a href="' + escapeHtml(htmlUrl) + '" target="_blank" rel="noopener" class="like-btn" title="在 GitHub 上点亮蜡烛">'
                    +       '<span class="like-icon">🕯︎</span>'
                    +       '<span class="like-count">' + likes + '</span>'
                    +     '</a>'
                    +     '<a href="' + escapeHtml(htmlUrl) + '" target="_blank" rel="noopener" class="reply-btn" title="在 GitHub 上回复">'
                    +       '<span>🗨︎</span>'
                    +     '</a>'
                    +   '</div>'
                    + '</article>';
            }

            // =====================================================
            // 渲染整个留言列表
            // =====================================================
            function renderComments(comments) {
                var container = document.getElementById('commentCards');
                var loadingHint = document.getElementById('loadingHint');

                // 隐藏加载提示
                if (loadingHint) loadingHint.style.display = 'none';

                if (!comments || comments.length === 0) {
                    // 暂无留言
                    container.innerHTML = ''
                        + '<div class="loading-hint card-fly-in entered">'
                        +   '<span>祈祷室空寂无声，成为第一位祈祷者。</span>'
                        + '</div>';
                    return;
                }

                // 拼接所有卡片 HTML
                var html = comments.map(function (c, i) {
                    return renderCommentCard(c, i);
                }).join('');

                container.innerHTML = html;

                // 逐个触发"飞入"动画（每个卡片延迟 60ms）
                var cards = container.querySelectorAll('.card-fly-in');
                cards.forEach(function (card) {
                    requestAnimationFrame(function () {
                        requestAnimationFrame(function () {
                            card.classList.add('entered');
                        });
                    });
                });
            }

            // =====================================================
            // 加载失败时显示
            // =====================================================
            function renderError(msg) {
                var container = document.getElementById('commentCards');
                var loadingHint = document.getElementById('loadingHint');
                if (loadingHint) loadingHint.style.display = 'none';

                container.innerHTML = ''
                    + '<div class="loading-hint card-fly-in entered">'
                    +   '<span>祈祷室召唤失败：' + escapeHtml(msg) + '</span><br>'
                    +   '<a href="' + ISSUE_URL + '" target="_blank" rel="noopener" style="color:#555;text-decoration:underline;margin-top:8px;display:inline-block;">前往 GitHub 查看</a>'
                    + '</div>';
            }

            // =====================================================
            // 加载留言数据 + 渲染
            // =====================================================
            function loadComments() {
                fetchComments()
                    .then(function (comments) {
                        renderComments(comments);
                    })
                    .catch(function (err) {
                        renderError(err.message);
                    });
            }

            // =====================================================
            // Utterances：放在弹窗里，用于发新留言
            // 提前在页面加载时就初始化，用户点开弹窗时已经准备好
            // =====================================================
            function initUtterances() {
                var container = document.getElementById('utterances-container');
                if (!container) return;

                var script = document.createElement('script');
                script.src = 'https://utteranc.es/client.js';
                script.setAttribute('repo', CONFIG.owner + '/' + CONFIG.repo);
                script.setAttribute('issue-number', CONFIG.issueNumber);
                script.setAttribute('theme', 'github-light');
                script.setAttribute('label', '大祈祷室');
                script.setAttribute('crossorigin', 'anonymous');
                script.async = true;

                container.appendChild(script);
            }

            // 打开 Utterances 弹窗
            function openUtterancesModal() {
                var modal = document.getElementById('utterancesModal');
                if (modal) {
                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';   // 禁止背景滚动
                }
            }

            // 关闭 Utterances 弹窗
            function closeUtterancesModal() {
                var modal = document.getElementById('utterancesModal');
                if (modal) {
                    modal.style.display = 'none';
                    document.body.style.overflow = '';
                }
            }

            // =====================================================
            // 顶部输入框：点击 iris.png 后
            //   1. 把内容复制到剪贴板
            //   2. 弹出 Utterances 弹窗让用户登录后粘贴发布
            // =====================================================
            function initSendButton() {
                var sendBtn  = document.getElementById('sendBtn');
                var mainInput = document.getElementById('mainInput');
                var closeBtn = document.getElementById('utterancesClose');
                if (!sendBtn) return;

                sendBtn.addEventListener('click', function () {
                    var text = mainInput.value.trim();

                    // 如果有内容，先复制到剪贴板
                    if (text) {
                        if (navigator.clipboard) {
                            navigator.clipboard.writeText(text).then(function () {
                                alert('祷词已复制到剪贴板。\n请在弹出的窗口中登录 GitHub 后粘贴发布。');
                                openUtterancesModal();
                            }).catch(function () {
                                // 复制失败，仍然打开弹窗
                                openUtterancesModal();
                            });
                        } else {
                            // 浏览器不支持 clipboard API，直接打开弹窗
                            openUtterancesModal();
                        }
                        mainInput.value = '';
                    } else {
                        // 没写内容，直接打开弹窗
                        openUtterancesModal();
                    }
                });

                // 关闭弹窗（关闭后延迟刷新评论列表，让用户看到刚发的新留言）
                if (closeBtn) {
                    closeBtn.addEventListener('click', function () {
                        closeUtterancesModal();
                        setTimeout(loadComments, 2000);   // 2秒后刷新（给 GitHub API 同步时间）
                    });
                }

                // 点弹窗遮罩关闭
                var modal = document.getElementById('utterancesModal');
                if (modal) {
                    modal.addEventListener('click', function (e) {
                        if (e.target === modal) closeUtterancesModal();
                    });
                }

                // 按 Esc 关闭弹窗
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') closeUtterancesModal();
                });
            }

            // =====================================================
            // 入场动画：让页面元素依次出现
            // =====================================================
            function initEntranceAnimations() {
                // 标题：立即淡入
                var header = document.querySelector('.page-header.fly-in');
                if (header) {
                    requestAnimationFrame(function () { header.classList.add('entered'); });
                }

                // 输入框：延迟 150ms 淡入
                setTimeout(function () {
                    var composer = document.querySelector('.composer.fly-in');
                    if (composer) composer.classList.add('entered');
                }, 150);

                // 加载提示：延迟 350ms 飞入
                setTimeout(function () {
                    var hint = document.querySelector('.loading-hint.card-fly-in');
                    if (hint) hint.classList.add('entered');
                }, 350);

                // 页脚：延迟 550ms 淡入
                setTimeout(function () {
                    var footer = document.querySelector('.bottom-inscription.fly-in');
                    if (footer) footer.classList.add('entered');
                }, 550);
            }

            // =====================================================
            // 两侧装饰：纯洁印记 + 竖排经文
            // 随机大小、位置、旋转角度，营造"古老祷文卷轴"的氛围
            // =====================================================

            // 纯洁印记图片（替换成你上传的文件名）
            var SEAL_IMAGES = [
                'seal1.png',
                'seal2.png',
                'seal3.png'
            ];

            // 竖排经文文字（战锤40K风格祷文、圣言、殉道者语录）
            var DECO_TEXTS = [
                '帝皇的圣光永不熄灭',
                '信仰即盾 忠诚即剑',
                '殉道者的灵魂归于帝皇',
                '异端必诛 奸奇必灭',
                '以帝皇之名 行审判之事',
                '星海浩瀚 唯帝皇是瞻',
                '吾等乃帝皇之锤',
                '死亡乃忠诚之证明',
                '神圣泰拉的光辉照耀众生',
                '愿帝皇的意志得以施行',
                '为了帝皇 为了人类',
                '不屈不挠 至死方休',
                '殉道者之血浇灌帝国之花',
                '圣光指引前路',
                '审判之日终将降临',
                '忠诚无价 荣誉永恒',
                '机械神教 万机之神',
                '虚空之中 帝皇同在',
                '真理之光照亮黑暗',
                '帝皇端坐黄金王座',
                '千年守望 万年不朽',
                '愿帝皇保佑你 孩子',
                '黑暗之中 唯帝皇是光',
                '我等乃帝皇的子民',
                '圣言入耳 圣光入心',
                '为帝国而死 无上荣光',
                '纯洁印记 神圣庇佑',
                '祈祷室中 帝皇聆听',
                '0x52686561',
                '神圣殉道录'
            ];

            // 工具函数：生成 min~max 之间的随机数
            function randomBetween(min, max) {
                return Math.random() * (max - min) + min;
            }

            // 工具函数：从数组里随机选一个
            function randomPick(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            // 生成单侧装饰（左侧或右侧）
            function generateSideDecoration(sideEl, side) {
                if (!sideEl) return;

                var vh = window.innerHeight;
                var itemCount = 14;   // 每侧放 14 个元素（图片 + 文字混合）

                for (var i = 0; i < itemCount; i++) {
                    var isSeal = Math.random() < 0.35;   // 35% 概率是印记图，65% 是文字
                    var item = document.createElement('div');
                    item.className = 'deco-item';

                    // 垂直位置：均匀分布在 0~100% 高度之间，加一点随机偏移
                    var top = (i / itemCount) * 100 + randomBetween(-3, 3);
                    top = Math.max(2, Math.min(95, top));   // 限制在 2%~95% 之间
                    item.style.top = top + '%';

                    // 水平位置：在装饰区内随机
                    var left = randomBetween(10, 70);
                    item.style.left = left + '%';

                    // 旋转角度：随机 -15° ~ +15°
                    var rotate = randomBetween(-15, 15);

                    if (isSeal) {
                        // 纯洁印记图片
                        var img = document.createElement('img');
                        img.className = 'deco-seal';
                        img.src = randomPick(SEAL_IMAGES);
                        img.alt = '';
                        img.draggable = false;

                        // 印记大小：60px ~ 130px
                        var size = randomBetween(60, 130);
                        img.style.width = size + 'px';

                        item.style.transform = 'rotate(' + rotate + 'deg)';
                        item.style.opacity = randomBetween(0.08, 0.18);   // 很淡，不抢眼
                        item.appendChild(img);
                    } else {
                        // 竖排文字
                        var text = document.createElement('div');
                        text.className = 'deco-text scale-x';
                        text.textContent = randomPick(DECO_TEXTS);

                        // 文字大小：11px ~ 18px
                        var fontSize = randomBetween(11, 18);
                        text.style.fontSize = fontSize + 'px';

                        // 透明度更淡一些
                        item.style.opacity = randomBetween(0.1, 0.22);
                        item.style.transform = 'rotate(' + rotate + 'deg)';
                        item.appendChild(text);
                    }

                    sideEl.appendChild(item);
                }
            }

            function initDecorations() {
                var leftEl  = document.getElementById('decoLeft');
                var rightEl = document.getElementById('decoRight');
                generateSideDecoration(leftEl, 'left');
                generateSideDecoration(rightEl, 'right');
            }

            // =====================================================
            // 页面加载完成后初始化
            // =====================================================
            document.addEventListener('DOMContentLoaded', function () {
                initDecorations();       // 生成两侧装饰元素
                initUtterances();        // 提前加载 Utterances（在隐藏的弹窗里）
                initSendButton();        // 绑定发送按钮 → 弹窗
                initEntranceAnimations(); // 入场动画
                loadComments();          // 拉取评论并渲染卡片
            });

        })();
    </script>

</body>
</html>
